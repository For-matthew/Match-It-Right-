<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2b2b2e"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dcae"/>
      <stop offset="0.5" stop-color="#c8915a"/>
      <stop offset="1" stop-color="#7a4b22"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9bdc4"/>
    </linearGradient>
  </defs>

  <!-- Hexagon shield -->
  <polygon points="128,8 232,68 232,188 128,248 24,188 24,68" fill="url(#gold)"/>
  <polygon points="128,22 220,75 220,181 128,234 36,181 36,75" fill="url(#bg)"/>

  <!-- MF monogram -->
  <g transform="translate(128 132) scale(0.82) translate(-128 -128)">
    <polygon fill="url(#silver)" points="50,176 50,80 74,80 90,118 106,80 130,80 130,176 108,176 108,124 96,152 84,152 72,124 72,176"/>
    <polygon fill="url(#gold)" points="140,176 140,80 206,80 206,101 163,101 163,119 198,119 198,140 163,140 163,176"/>
  </g>

  <!-- Code brackets -->
  <g fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="104,196 94,205 104,214"/>
    <line x1="122" y1="216" x2="134" y2="194"/>
    <polyline points="152,196 162,205 152,214"/>
  </g>

  <!-- Coffee steam -->
  <g fill="none" stroke="#c8915a" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M116 60 q-6 -7 0 -14 q6 -7 0 -14"/>
    <path d="M140 60 q-6 -7 0 -14 q6 -7 0 -14"/>
  </g>
</svg>